[project]
name = "mailweave"
version = "0.2.0b1"
description = "MailWeave MCP server: evidence-preserving Gmail retrieval."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.1.1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<0.29",
    "selectolax>=0.3.21",
    "lxml>=5.2",
]

[project.optional-dependencies]
# The local semantic runtime (AD D.5 stage A and stage B). Optional on purpose: the default
# install carries no model runtime, the rung declines with a reason when it is absent, and
# SEM-02's "hosted is never required" is about the *interface*, not about this extra.
semantic = [
    "sentence-transformers>=3.0,<6",
]

[project.scripts]
mailweave = "mailweave.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailweave"]
