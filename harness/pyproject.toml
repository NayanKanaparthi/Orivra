[project]
name = "mailweave-harness"
version = "0.1.0"
description = "MailWeave evaluation harness. Separate package, separate OAuth client, separate scopes."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The dependency direction is harness -> server, and a CI guard enforces the reverse
# is impossible. It is declared here because round 11 makes it real: the preflight
# probes drive the WS-02 Gmail client.
# The harness is not part of the release and keeps its own version; the pin is here so the
# workspace resolves one `mailweave` rather than two.
dependencies = ["pydantic>=2.9,<3", "mailweave==0.2.0b1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailweave_harness"]
