[project]
name = "mailweave-workspace"
version = "0.0.0"
description = "MailWeave workspace root: server + harness + repo tooling."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mailweave",
    "mailweave-harness",
    "orivra",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    # Round 28: the affordance tests validate minted calls against the published
    # inputSchema with a real JSON Schema validator, which is what a strict client does.
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "harness", "orivra"]

[tool.uv.sources]
mailweave = { workspace = true }
mailweave-harness = { workspace = true }
orivra = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server/src", "harness/src", "orivra/src", "."]
# Reviewer reports are evidence, not source. `ruff format` rewrites Python inside their
# fenced blocks, which silently edits another agent's report (R-ARCH-007).
extend-exclude = ["docs/reviews/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ARG", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# A test double must match the signature it stands in for, so an unused
# parameter in a stub or lambda is the point rather than an oversight.
"tests/**" = ["ARG001", "ARG002", "ARG005", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "server/src:harness/src:orivra/src"
packages = ["mailweave", "mailweave_harness", "orivra", "tools", "tests"]
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["selectolax.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test that is permitted to open sockets (never run in the default offline suite)",
    "replant: reintroduction test that copies the tree and re-runs pytest in a subprocess",
]
filterwarnings = [
    "error::DeprecationWarning:mailweave.*",
    "error::DeprecationWarning:orivra.*",
]

[[tool.mypy.overrides]]
# The test suite is fully typed, but hypothesis' `@given` and pytest's fixtures are
# untyped decorators; requiring annotations on them would add noise, not safety.
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# The local model runtime is an optional extra (`semantic`). The server declines cleanly
# when it is absent - that is D.5's deterministic fallback - so its stubs are not a
# requirement for type-checking the default install.
module = ["sentence_transformers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
