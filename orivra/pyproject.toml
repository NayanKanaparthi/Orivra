[project]
name = "orivra"
version = "0.2.0b1"
description = "Orivra: source-independent evidence retrieval. MailWeave is its Gmail engine."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # MailWeave, unchanged and unrenamed. Orivra depends on it; it does not depend on
    # Orivra, and nothing here edits it.
    #
    # **Pinned exactly, 2026-09-19.** It was unversioned, which is right inside a `uv`
    # workspace - the source is resolved from the tree - and wrong in a published wheel,
    # where it would accept whatever `mailweave` happened to be installed. The two ship
    # together at one version and Orivra composes MailWeave's response inside its own, so
    # a mismatched pair is not a configuration this release has ever been run in.
    "mailweave==0.2.0b1",
    "mcp==2.1.1",
    "pydantic>=2.9",
]

[project.scripts]
orivra = "orivra.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orivra"]
